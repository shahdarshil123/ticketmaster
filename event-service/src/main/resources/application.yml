server:
  port: 8081

spring:
  application:
    name: event-service
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/event_db
    username: ticketmaster
    password: ticketmaster

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update     # temporary: Hibernate creates tables until Flyway migrations are added
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
