server:
  port: 8082

spring:
  application:
    name: booking-service
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5433/booking_db
    username: ticketmaster
    password: ticketmaster

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: booking-service
      auto-offset-reset: earliest

ticketmaster:
  hold:
    ttl: PT10M              # how long a seat hold lasts
    sweep-interval: PT30S   # how often expired holds are reclaimed

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
